[project]
name = "conform"
version = "0.1.0"
description = "CONFORM - compile generative media, don't regenerate it. Agentic Cinema hackathon, ClickHouse track."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
